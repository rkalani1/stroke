name = "stroke-suggestion-relay"
main = "worker.js"
compatibility_date = "2026-08-15"

[vars]
# Blank = email-only delivery, which is the configured behaviour: suggestions
# go to the maintainer's inbox, not to the issue tracker. Set it to "owner/repo"
# only if you also want an issue filed for tracking.
GITHUB_REPO = ""
# CORS origin for the app. Pins the browser-side caller to the app's own origin.
ALLOWED_ORIGIN = "https://rkalani1.github.io"
# From-address. The Resend sandbox sender works for testing; switch to an
# address on a domain you have verified with Resend before relying on it,
# or university mail filters may drop it.
NOTIFY_FROM = "Stroke suggestions <onboarding@resend.dev>"

# Secrets are never vars. Set them with:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put NOTIFY_EMAIL
#
# NOTIFY_EMAIL is a secret rather than a var on purpose: the maintainer's
# address is an institutional identifier, and this repository's leak guard bans
# those from every tracked file. Keeping it in Cloudflare means the address is
# never committed anywhere.
