<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A6571">
  <meta name="description" content="Synthetic Encounter workspace with deterministic calculations and protected example protocols. Do not enter PHI or real encounter data. This is not an approved clinical tool.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json?v=7.0.0">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Stroke · Encounter workspace</title>
  <link rel="modulepreload" href="app.js?v=7.0.0">
  <link rel="stylesheet" href="tailwind.css?v=7.0.0">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/publicsans-normal-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/bricolage-700.woff2">
  <script>
    (function () {
      const APP_VERSION = '7.0.0';
      let pref = null;
      try { pref = localStorage.getItem('stroke.v7.theme'); } catch (_) {}
      const isPublicPages = /(^|\.)github\.io$/i.test(location.hostname || '');
      const prefersDark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      const mode = ['light','dark','auto'].includes(pref) ? pref : (isPublicPages ? 'light' : 'auto');
      document.documentElement.setAttribute('data-theme', mode === 'dark' || mode === 'auto' && prefersDark ? 'dark' : 'light');
      // Remove only this application's retired clinical storage; no encounter values are read or migrated.
      const legacy = ['patientData','nihssScore','aspectsScore','gcsItems','mrsScore','ichScoreItems','strokeCodeForm','lkwTime','telestrokeNote','census','activePatients','apiKey','stroke.appData.v2'];
      try { for (const key of Object.keys(localStorage)) if (key.startsWith('strokeApp:') || legacy.includes(key)) localStorage.removeItem(key); } catch (_) {}
      try { for (const key of Object.keys(sessionStorage)) if (key.startsWith('strokeApp:') || legacy.includes(key)) sessionStorage.removeItem(key); } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript to use the synthetic Encounter workspace.</noscript>
  <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Application error:', msg, 'at line', lineNo);
            if (document.getElementById('runtime-error-notice')) return false;
            const notice = document.createElement('div');
            notice.id = 'runtime-error-notice';
            notice.setAttribute('role', 'alert');
            notice.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:10000;max-width:680px;margin:auto;padding:16px;border:2px solid #b91c1c;border-radius:8px;background:#fff;color:#111827;font:16px/1.5 system-ui;box-shadow:0 4px 24px #0003;';
            const message = document.createElement('p');
            message.style.margin = '0 0 12px';
            message.textContent = 'An unexpected error occurred. This page has not reloaded. Recheck current inputs before continuing. Reload only when ready; unsaved inputs will be lost.';
            notice.appendChild(message);
            const reload = document.createElement('button');
            reload.type = 'button';
            reload.textContent = 'Reload when ready';
            reload.style.cssText = 'min-height:44px;padding:8px 16px;border:1px solid #111827;border-radius:4px;background:#fff;color:#111827;font:inherit;cursor:pointer;';
            reload.addEventListener('click', () => window.location.reload());
            notice.appendChild(reload);
            document.body.appendChild(notice);
            return false;
        };

  </script>
  <script type="module" src="app.js?v=7.0.0"></script>
</body>
</html>
