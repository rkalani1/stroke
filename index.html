    <link rel="modulepreload" href="app.js?v=6.30.7">
    <link rel="stylesheet" href="tailwind.css?v=6.30.7">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/publicsans-normal-400.woff2">

    <!-- Every style rule, including the shell styles that used to be inlined
         here, ships in tailwind.css. It is a render-blocking <link>, so
         nothing paints unstyled; the pre-paint script below only has to pick
         the theme. -->
    <script>
        // CRITICAL: Version management and automatic data cleanup
        // This runs BEFORE React loads to prevent crashes from incompatible data
        (function() {
            const APP_VERSION = '6.30.7'; // Keep in sync with service-worker.js APP_VERSION/CACHE_NAME, the ?v= asset queries, and package.json version
            const STORAGE_PREFIX = 'strokeApp:';
            const APP_DATA_KEY = 'stroke.appData.v2';
            const IS_PUBLIC_PAGES = /(^|\.)github\.io$/i.test(window.location.hostname || '');
            const LEGACY_KEYS = [
                'app_version',
                'darkMode',
                'activeTab',
                'patientData',
                'nihssScore',
                'aspectsScore',
                'gcsItems',
                'mrsScore',
                'ichScoreItems',
                'abcd2Items',
                'chads2vascItems',
                'ropeItems',
                'huntHessGrade',
                'wfnsGrade',
                'hasbledItems',
                'rcvs2Items',
                'strokeCodeForm',
                'lkwTime',
                'currentStep',
                'completedSteps',
                'aspectsRegionState',
                'pcAspectsRegions',
                'telestrokeNote',
                'telestrokeTemplate',
                'thrombolysisAlertsMuted',
                'timerSidebarCollapsed',
                'shiftPatients',
                'currentPatientId',
                'consultationType',
                'ttlHoursOverride',
                'lastUpdated',
                'legacyMigrated'
            ];
            const LEGACY_SESSION_KEYS = ['error_reload_attempted'];

            const parseStoredValue = (raw) => {
                if (raw === null || raw === undefined) return null;
                try {
                    return JSON.parse(raw);
                } catch {
                    return raw;
                }
            };

            const getStoredValue = (key) => {
                try {
                    const namespaced = localStorage.getItem(STORAGE_PREFIX + key);
                    if (namespaced !== null) {
                        return parseStoredValue(namespaced);
                    }
                    return parseStoredValue(localStorage.getItem(key));
                } catch (_) { return null; }
            };

            const setStoredValue = (key, value) => {
                try {
                    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
                } catch (e) {
                    console.warn('Failed to write storage key:', key, e);
                }
            };

            const clearAppStorage = (options = {}) => {
                const includeLegacy = options.includeLegacy !== false;
                try {
                    Object.keys(localStorage).forEach((key) => {
                        if (key.startsWith(STORAGE_PREFIX)) {
                            localStorage.removeItem(key);
                        }
                    });
                    localStorage.removeItem(APP_DATA_KEY);
                    if (includeLegacy) {
                        LEGACY_KEYS.forEach((key) => localStorage.removeItem(key));
                    }
                    Object.keys(sessionStorage).forEach((key) => {
                        if (key.startsWith(STORAGE_PREFIX)) {
                            sessionStorage.removeItem(key);
                        }
                    });
                    LEGACY_SESSION_KEYS.forEach((key) => sessionStorage.removeItem(key));
                } catch (e) {
                    console.warn('Storage clear failed:', e);
                }
            };

            window.strokeAppStorage = {
                prefix: STORAGE_PREFIX,
                appDataKey: APP_DATA_KEY,
                legacyKeys: LEGACY_KEYS,
                legacySessionKeys: LEGACY_SESSION_KEYS,
                getStoredValue,
                setStoredValue,
                clearAppStorage,
                appVersion: APP_VERSION
            };

            const storedVersion = getStoredValue('app_version');
            const storedDarkMode = getStoredValue('darkMode') === true;

            // If version doesn't match, clear app storage to prevent crashes
            if (storedVersion && storedVersion !== APP_VERSION) {
                console.log('Version change detected (' + storedVersion + ' -> ' + APP_VERSION + '). Clearing app storage for compatibility.');
                clearAppStorage({ includeLegacy: false });
                if (!IS_PUBLIC_PAGES && storedDarkMode) {
                    setStoredValue('darkMode', true);
                }
            }

            setStoredValue('app_version', APP_VERSION);

            // Theme initialization — pre-paint, BEFORE app.js loads, so the first
            // paint is already in the right theme on every host (GitHub Pages, a
            // self-hosted copy, the native wrapper). Same rule as the app's
            // theme controller (resolveTheme) and offline.html:
            //   explicit 'dark' | 'light' → that; 'auto' → the OS preference;
            //   unset → light on public Pages, the OS preference elsewhere.
            // [data-theme] on <html> is the only dark-mode hook the CSS reads.
            let storedThemePref = null;
            try { storedThemePref = localStorage.getItem('stroke.v7.theme'); } catch (e) { /* ignore */ }
            let themePref = (storedThemePref === 'light' || storedThemePref === 'dark' || storedThemePref === 'auto')
                ? storedThemePref : null;
            if (IS_PUBLIC_PAGES) {
                // Legacy v5 'darkMode' key is superseded by stroke.v7.theme — clean
                // it up, but never the v7 pref (that bug made Dark unreachable on
                // public).
                try { localStorage.removeItem('darkMode'); } catch (e) { /* ignore */ }
            } else if (storedThemePref === null && storedDarkMode) {
                // Non-public: honour a legacy v5 Dark choice until app.js's
                // runV7Migration() carries it into stroke.v7.theme.
                themePref = 'dark';
            }
            const prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const themeMode = themePref || (IS_PUBLIC_PAGES ? 'light' : 'auto');
            const isDarkTheme = themeMode === 'dark' || (themeMode === 'auto' && prefersDark);
            document.documentElement.setAttribute('data-theme', isDarkTheme ? 'dark' : 'light');
        })();
    </script>

    <script>
        // Runtime errors must not erase storage or reload an active encounter.
        // Recovery is an explicit user action; keep existing inputs in place.
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Application error:', msg, 'at line', lineNo);
            if (document.getElementById('runtime-error-notice')) return false;
            const notice = document.createElement('div');
            notice.id = 'runtime-error-notice';
            notice.setAttribute('role', 'alert');
            notice.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:10000;max-width:680px;margin:auto;padding:16px;border:2px solid #b91c1c;border-radius:8px;background:#fff;color:#111827;font:16px/1.5 system-ui;box-shadow:0 4px 24px #0003;';
            const message = document.createElement('p');
            message.style.margin = '0 0 12px';
            message.textContent = 'An unexpected error occurred. This page has not reloaded. Recheck current inputs before continuing. Reload only when ready; unsaved inputs will be lost.';
            notice.appendChild(message);
            const reload = document.createElement('button');
            reload.type = 'button';
            reload.textContent = 'Reload when ready';
            reload.style.cssText = 'min-height:44px;padding:8px 16px;border:1px solid #111827;border-radius:4px;background:#fff;color:#111827;font:inherit;cursor:pointer;';
            reload.addEventListener('click', () => window.location.reload());
            notice.appendChild(reload);
            document.body.appendChild(notice);
            return false;
        };
    </script>
    <script type="module" src="app.js?v=6.30.7"></script>
