name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install private leak-guard denylist
        env:
          PRIVATE_DENYLIST_JSON: ${{ secrets.STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON }}
        run: |
          if [ -z "$PRIVATE_DENYLIST_JSON" ]; then
            echo "STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON secret is required for CI leak scanning." >&2
            exit 1
          fi
          printf '%s' "$PRIVATE_DENYLIST_JSON" > scripts/leak-guard-denylist.local.json
          STROKE_LEAK_GUARD_REQUIRE_PRIVATE=1 npm run check:leak-guard

      - name: Verify main deployment repository state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          STROKE_VERIFY_DEPLOYMENT_STATE: '1'
        run: >-
          npx vitest run
          tests/adversarial-m4-challenger.test.js
          --testNamePattern
          'verifies working tree is completely clean|verifies current branch is main and tracks origin/main|verifies git log commit message and author metadata'

      # Browser-backed protection checks require Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run vitest
        run: npm run test:unit

      # Offline-deterministic content guards. These re-validate the committed
      # content layer and generated assets without any network access (no
      # PubMed/NCBI lookups — validate:pmids --check-identifiers and other
      # network-dependent checks are deliberately NOT wired here).
      - name: Content validation
        run: npm run content:validate

      - name: Agent assets check
        run: npm run agent:assets:check

      - name: Upload vitest output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: |
            output/diagnostics/
            test-output/
          if-no-files-found: ignore

  mcp-smoke:
    name: MCP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        run: npm ci --prefix mcp

      - name: Run MCP smoke
        run: npm run test:mcp

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install private leak-guard denylist
        env:
          PRIVATE_DENYLIST_JSON: ${{ secrets.STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON }}
        run: |
          if [ -z "$PRIVATE_DENYLIST_JSON" ]; then
            echo "STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON secret is required for CI leak scanning." >&2
            exit 1
          fi
          printf '%s' "$PRIVATE_DENYLIST_JSON" > scripts/leak-guard-denylist.local.json
          STROKE_LEAK_GUARD_REQUIRE_PRIVATE=1 npm run check:leak-guard

      # Cache Playwright browsers across runs to avoid the ~80MB download every
      # invocation. Cache key keyed on the package-lock so it auto-busts when
      # the playwright version changes. Only safe inputs are interpolated:
      # runner.os and hashFiles() are runner-controlled, not user-controlled.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate QA latency profile schema
        run: |
          mkdir -p output/diagnostics
          set -o pipefail
          npm run validate:qa-latency-profiles 2>&1 | tee output/diagnostics/qa-latency-profile-validation.log

      - name: Build
        run: npm run build

      - name: Build output drift (tailwind.css)
        # tailwind.css is a committed build output served as-is by GitHub
        # Pages. A config, content-glob or stylesheet change that ships without
        # the rebuilt CSS silently drops or keeps utilities; the minified
        # output is deterministic, so any diff after the Build step is drift.
        run: |
          git diff --exit-code --stat -- tailwind.css || {
            echo '::error file=tailwind.css::tailwind.css is stale: run `npm run build:css` and commit the result.'
            exit 1
          }

      - name: Asset budget
        # Hard gate on payload bytes. The Lighthouse workflow writes Performance
        # as advisory (CDN/device sensitive), which let the bundle grow 52%
        # between 2026-05 and 2026-08 unnoticed. Bytes are deterministic.
        run: npm run check:asset-budget

      - name: Example Protocols content lock
        run: |
          mkdir -p output/diagnostics
          set -o pipefail
          npm run test:protocol-snapshot 2>&1 | tee output/diagnostics/protocol-snapshot.log

      - name: Content currency report (advisory)
        run: |
          mkdir -p output/diagnostics
          set -o pipefail
          npm run content:currency 2>&1 | tee output/diagnostics/content-currency.log

      - name: Validate citations and run local smoke
        run: npm test

      - name: Archived baseline upgrade and failure recovery
        run: |
          git fetch --no-tags origin refs/tags/archive/pre-encounter-first-20261001-4f8e99d:refs/tags/archive/pre-encounter-first-20261001-4f8e99d
          mkdir -p output/baseline
          git archive archive/pre-encounter-first-20261001-4f8e99d | tar -x -C output/baseline
          node scripts/qa-upgrade.mjs --baseline-dir output/baseline

      - name: Run adaptive strict local latency smoke
        run: |
          mkdir -p output/diagnostics
          set -o pipefail
          npm run qa:latency-adaptive-local 2>&1 | tee output/diagnostics/qa-latency-adaptive-local.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-artifacts
          path: |
            output/playwright
            output/diagnostics/qa-latency-profile-validation.log
            output/diagnostics/qa-latency-adaptive-local.log
            docs/qa-latency-profiles.json
          if-no-files-found: ignore

  adaptive-latency-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install private leak-guard denylist
        env:
          PRIVATE_DENYLIST_JSON: ${{ secrets.STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON }}
        run: |
          if [ -z "$PRIVATE_DENYLIST_JSON" ]; then
            echo "STROKE_LEAK_GUARD_PRIVATE_DENYLIST_JSON secret is required for CI leak scanning." >&2
            exit 1
          fi
          printf '%s' "$PRIVATE_DENYLIST_JSON" > scripts/leak-guard-denylist.local.json
          STROKE_LEAK_GUARD_REQUIRE_PRIVATE=1 npm run check:leak-guard

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Stage allowlisted public artifact for local QA
        run: npm run publish:stage

      # This job probes the LIVE site, but it starts the moment main is pushed
      # -- concurrently with the `pages build and deployment` run it measures.
      # Without this gate it read a half-swapped deploy and failed on every main
      # merge (functional issue, not latency: 7886 ms against a 50000 ms
      # threshold). Reproduced identically on e9ae449 and 8a13c27; both passed
      # on re-run after the deploy settled, with no code change.
      - name: Wait for live Pages deployment
        if: github.ref == 'refs/heads/main'
        run: npm run qa:wait-for-live-pages

      - name: Run adaptive strict QA (local + live)
        run: |
          mkdir -p output/diagnostics
          set -o pipefail
          node scripts/qa-smoke.mjs --live --latency-profile adaptive --latency-profiles-file docs/qa-latency-profiles.json --enforce-latency-thresholds 2>&1 | tee output/diagnostics/qa-latency-adaptive-strict.log

      - name: Upload adaptive latency smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-latency-smoke-artifacts
          path: |
            output/playwright
            output/diagnostics/qa-latency-adaptive-strict.log
            output/diagnostics/qa-latency-profile-validation.log
            docs/qa-latency-profiles.json
          if-no-files-found: ignore
