<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" role="img" aria-labelledby="afib-title afib-desc">
  <title id="afib-title">Post-Stroke Atrial Fibrillation Anticoagulation Timing Protocol</title>
  <desc id="afib-desc">Clinical decision matrix for initiating DOAC/anticoagulation timing after ischemic stroke based on NIHSS stroke severity (1-3-6-12 Day Rule).</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; }
      .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #fb7185; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #e2e8f0; line-height: 1.5; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .card-bg { fill: #ffffff; stroke: #cbd5e1; }
        .title-text { fill: #0f172a; }
        .subtitle-text { fill: #e11d48; }
        .card-body { fill: #334155; }
        .card-sub { fill: #64748b; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="850" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="95" rx="12" stroke="#e11d48" stroke-width="2"/>
    <text x="560" y="42" class="title-text" text-anchor="middle">POST-STROKE AFIB ANTICOAGULATION TIMING PROTOCOL</text>
    <text x="560" y="70" class="subtitle-text" text-anchor="middle">The "1 – 3 – 6 – 12 Day Rule" for DOAC / OAC Resumption Post-Ischemic Stroke</text>
  </g>

  <!-- 4 Severity Tiers Matrix -->
  <!-- Tier 1: TIA -->
  <g transform="translate(40, 145)" filter="url(#shadow)">
    <rect class="card-bg" width="260" height="470" rx="12" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="50" fill="#10b981" rx="11"/>
    <text x="130" y="32" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">DAY 1 (TIA)</text>
    
    <text x="20" y="80" class="card-title" fill="#34d399">Transient Ischemic Attack</text>
    <text x="20" y="102" class="card-body" font-weight="700">• Severity: NIHSS 0</text>
    <text x="20" y="120" class="card-sub">• No acute lesion on brain CT/MRI.</text>

    <text x="20" y="155" class="card-title" fill="#f8fafc" font-size="15">Timing Rule:</text>
    <text x="20" y="178" class="card-body" font-weight="700" fill="#34d399">Initiate Anticoagulation at Day 1 (Immediate / &lt; 24h)</text>

    <text x="20" y="220" class="card-body" font-weight="700">• Requirements:</text>
    <text x="25" y="240" class="card-sub">1. Exclude parenchymal hemorrhage on NCCT/MRI.</text>
    <text x="25" y="260" class="card-sub">2. Blood Pressure controlled (&lt; 180/105 mmHg).</text>

    <rect x="15" y="380" width="230" height="70" fill="#064e3b" rx="8"/>
    <text x="130" y="405" class="card-title" fill="#a7f3d0" font-size="14" text-anchor="middle">LOW REBLEED RISK</text>
    <text x="130" y="430" class="card-sub" fill="#ffffff" text-anchor="middle">Start DOAC Day 1 immediately</text>
  </g>

  <!-- Tier 2: Minor Stroke -->
  <g transform="translate(326, 145)" filter="url(#shadow)">
    <rect class="card-bg" width="260" height="470" rx="12" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="50" fill="#0284c7" rx="11"/>
    <text x="130" y="32" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">DAY 3 (MINOR)</text>
    
    <text x="20" y="80" class="card-title" fill="#38bdf8">Minor Ischemic Stroke</text>
    <text x="20" y="102" class="card-body" font-weight="700">• Severity: NIHSS &lt; 8</text>
    <text x="20" y="120" class="card-sub">• Small infarct area (&lt; 1.5 cm).</text>

    <text x="20" y="155" class="card-title" fill="#f8fafc" font-size="15">Timing Rule:</text>
    <text x="20" y="178" class="card-body" font-weight="700" fill="#38bdf8">Initiate Anticoagulation at Day 3 post-stroke</text>

    <text x="20" y="220" class="card-body" font-weight="700">• Requirements:</text>
    <text x="25" y="240" class="card-sub">1. Neurologically stable.</text>
    <text x="25" y="260" class="card-sub">2. Repeat neuroimaging optional if stable, mandatory if clinical drop.</text>

    <rect x="15" y="380" width="230" height="70" fill="#0c4a6e" rx="8"/>
    <text x="130" y="405" class="card-title" fill="#7dd3fc" font-size="14" text-anchor="middle">MODERATE BENFIT</text>
    <text x="130" y="430" class="card-sub" fill="#ffffff" text-anchor="middle">Start DOAC Day 3 after review</text>
  </g>

  <!-- Tier 3: Moderate Stroke -->
  <g transform="translate(613, 145)" filter="url(#shadow)">
    <rect class="card-bg" width="260" height="470" rx="12" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="50" fill="#d97706" rx="11"/>
    <text x="130" y="32" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">DAY 6 (MODERATE)</text>
    
    <text x="20" y="80" class="card-title" fill="#fbbf24">Moderate Stroke</text>
    <text x="20" y="102" class="card-body" font-weight="700">• Severity: NIHSS 8 – 15</text>
    <text x="20" y="120" class="card-sub">• Moderate territory involvement.</text>

    <text x="20" y="155" class="card-title" fill="#f8fafc" font-size="15">Timing Rule:</text>
    <text x="20" y="178" class="card-body" font-weight="700" fill="#fbbf24">Initiate Anticoagulation at Day 6 post-stroke</text>

    <text x="20" y="220" class="card-body" font-weight="700">• Requirements:</text>
    <text x="25" y="240" class="card-sub">1. Mandatory repeat CT/MRI at Day 6 before starting.</text>
    <text x="25" y="260" class="card-sub">2. Confirm NO significant hemorrhagic transformation.</text>

    <rect x="15" y="380" width="230" height="70" fill="#78350f" rx="8"/>
    <text x="130" y="405" class="card-title" fill="#fde68a" font-size="14" text-anchor="middle">IMAGING CHECK MANDATORY</text>
    <text x="130" y="430" class="card-sub" fill="#ffffff" text-anchor="middle">Repeat CT/MRI at Day 6</text>
  </g>

  <!-- Tier 4: Severe Stroke -->
  <g transform="translate(900, 145)" filter="url(#shadow)">
    <rect class="card-bg" width="260" height="470" rx="12" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="50" fill="#dc2626" rx="11"/>
    <text x="130" y="32" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">DAY 12–14 (SEVERE)</text>
    
    <text x="20" y="80" class="card-title" fill="#fca5a5">Severe Ischemic Stroke</text>
    <text x="20" y="102" class="card-body" font-weight="700">• Severity: NIHSS ≥ 16</text>
    <text x="20" y="120" class="card-sub">• Large MCA infarct (&gt; 1/3 territory).</text>

    <text x="20" y="155" class="card-title" fill="#f8fafc" font-size="15">Timing Rule:</text>
    <text x="20" y="178" class="card-body" font-weight="700" fill="#fca5a5">Initiate Anticoagulation at Day 12 – 14</text>

    <text x="20" y="220" class="card-body" font-weight="700">• Requirements:</text>
    <text x="25" y="240" class="card-sub">1. Mandatory repeat CT/MRI.</text>
    <text x="25" y="260" class="card-sub">2. Exclude parenchymal hematoma (PH1/PH2). Minor HI1/HI2 ok.</text>

    <rect x="15" y="380" width="230" height="70" fill="#7f1d1d" rx="8"/>
    <text x="130" y="405" class="card-title" fill="#fecaca" font-size="14" text-anchor="middle">HIGH HT RISK</text>
    <text x="130" y="430" class="card-sub" fill="#ffffff" text-anchor="middle">Delay to Day 12-14 + Scan</text>
  </g>

  <!-- DOAC Dosing Guide & Clinical Pearls -->
  <g transform="translate(40, 635)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="185" rx="12"/>
    <text x="25" y="30" class="card-title" fill="#38bdf8">DOAC SELECTION &amp; DOSING REGIMENS (FIRST LINE OVER WARFARIN):</text>
    
    <g transform="translate(25, 45)">
      <!-- Apixaban -->
      <rect width="255" height="120" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="25" class="card-title" fill="#4ade80" font-size="15">Apixaban (Eliquis)</text>
      <text x="15" y="48" class="card-body" font-weight="700">5 mg PO BID</text>
      <text x="15" y="70" class="card-sub">Reduce to 2.5 mg BID if ≥2 of:</text>
      <text x="15" y="88" class="card-sub">• Age ≥ 80, Weight ≤ 60kg,</text>
      <text x="15" y="104" class="card-sub">• Serum Creatinine ≥ 1.5 mg/dL.</text>
    </g>

    <g transform="translate(300, 45)">
      <!-- Rivaroxaban -->
      <rect width="255" height="120" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="25" class="card-title" fill="#38bdf8" font-size="15">Rivaroxaban (Xarelto)</text>
      <text x="15" y="48" class="card-body" font-weight="700">20 mg PO Daily (with meal)</text>
      <text x="15" y="70" class="card-sub">Reduce to 15 mg Daily if:</text>
      <text x="15" y="88" class="card-sub">• CrCl 15 – 49 mL/min.</text>
      <text x="15" y="104" class="card-sub">Avoid if CrCl &lt; 15 mL/min.</text>
    </g>

    <g transform="translate(575, 45)">
      <!-- Dabigatran -->
      <rect width="255" height="120" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="25" class="card-title" fill="#a855f7" font-size="15">Dabigatran (Pradaxa)</text>
      <text x="15" y="48" class="card-body" font-weight="700">150 mg PO BID</text>
      <text x="15" y="70" class="card-sub">Reduce to 75 mg BID if:</text>
      <text x="15" y="88" class="card-sub">• CrCl 15 – 30 mL/min.</text>
      <text x="15" y="104" class="card-sub">Specific Reversal: Idarucizumab.</text>
    </g>

    <g transform="translate(850, 45)">
      <!-- Edoxaban -->
      <rect width="245" height="120" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="25" class="card-title" fill="#f59e0b" font-size="15">Edoxaban (Savaysa)</text>
      <text x="15" y="48" class="card-body" font-weight="700">60 mg PO Daily</text>
      <text x="15" y="70" class="card-sub">Reduce to 30 mg Daily if:</text>
      <text x="15" y="88" class="card-sub">• CrCl 15–50, Wt ≤60kg, or</text>
      <text x="15" y="104" class="card-sub">• P-gp inhibitor use.</text>
    </g>
  </g>
</svg>