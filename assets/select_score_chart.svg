<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" role="img" aria-labelledby="select-title select-desc">
  <title id="select-title">SeLECT Score Visual Risk Calculator Chart</title>
  <desc id="select-desc">Visual scoring system and risk curve chart for predicting 1-year and 5-year late post-stroke seizure risk after ischemic stroke.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; }
      .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #c084fc; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #e2e8f0; line-height: 1.5; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .card-bg { fill: #ffffff; stroke: #cbd5e1; }
        .title-text { fill: #0f172a; }
        .subtitle-text { fill: #7c3aed; }
        .card-body { fill: #334155; }
        .card-sub { fill: #64748b; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="850" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="90" rx="12" stroke="#7c3aed" stroke-width="2"/>
    <text x="560" y="40" class="title-text" text-anchor="middle">SeLECT SCORE — POST-STROKE SEIZURE RISK CHART</text>
    <text x="560" y="68" class="subtitle-text" text-anchor="middle">Prediction Model for Late Post-Stroke Epilepsy (1-Year &amp; 5-Year Risk Stratification)</text>
  </g>

  <!-- Left Column: Component Criteria Table -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="480" height="670" rx="12"/>
    <text x="25" y="35" class="card-title" fill="#c084fc">SeLECT SCORE COMPONENTS (0 – 9 POINTS):</text>

    <!-- Item S: Severity -->
    <g transform="translate(20, 55)">
      <rect width="440" height="115" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#38bdf8" font-size="15">S — Severity of Stroke (NIHSS Score)</text>
      <text x="15" y="48" class="card-body">• NIHSS 0 – 4: <tspan font-weight="700" fill="#4ade80">0 Points</tspan></text>
      <text x="15" y="68" class="card-body">• NIHSS 5 – 9: <tspan font-weight="700" fill="#fbbf24">1 Point</tspan></text>
      <text x="15" y="88" class="card-body">• NIHSS 10 – 15: <tspan font-weight="700" fill="#f97316">2 Points</tspan>  |  NIHSS ≥ 16: <tspan font-weight="700" fill="#ef4444">3 Points</tspan></text>
    </g>

    <!-- Item e: Early Seizures -->
    <g transform="translate(20, 182)">
      <rect width="440" height="85" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#fb7185" font-size="15">e — Early Seizures (&lt; 7 Days Post-Stroke)</text>
      <text x="15" y="48" class="card-body">• Absent: <tspan font-weight="700" fill="#4ade80">0 Points</tspan></text>
      <text x="15" y="68" class="card-body">• Present (&lt; 7 days): <tspan font-weight="700" fill="#ef4444">1 Point</tspan></text>
    </g>

    <!-- Item L: Location -->
    <g transform="translate(20, 279)">
      <rect width="440" height="85" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#a7f3d0" font-size="15">L — Cortical Location Involvement</text>
      <text x="15" y="48" class="card-body">• Subcortical / Brainstem only: <tspan font-weight="700" fill="#4ade80">0 Points</tspan></text>
      <text x="15" y="68" class="card-body">• Cortical involvement: <tspan font-weight="700" fill="#ef4444">2 Points</tspan></text>
    </g>

    <!-- Item E: Etiology -->
    <g transform="translate(20, 376)">
      <rect width="440" height="85" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#fde68a" font-size="15">E — Etiology (Atherosclerotic LAA)</text>
      <text x="15" y="48" class="card-body">• Non-LAA (CE, SVO, UND, OTH): <tspan font-weight="700" fill="#4ade80">0 Points</tspan></text>
      <text x="15" y="68" class="card-body">• Large Artery Atherosclerosis (LAA): <tspan font-weight="700" fill="#fbbf24">1 Point</tspan></text>
    </g>

    <!-- Item CT: Combined Territory -->
    <g transform="translate(20, 473)">
      <rect width="440" height="85" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#a5b4fc" font-size="15">CT — Combined Territory Involvement</text>
      <text x="15" y="48" class="card-body">• Single arterial territory: <tspan font-weight="700" fill="#4ade80">0 Points</tspan></text>
      <text x="15" y="68" class="card-body">• Multifocal / Combined territories: <tspan font-weight="700" fill="#fbbf24">1 Point</tspan></text>
    </g>

    <!-- Clinical Prophylaxis Box -->
    <g transform="translate(20, 570)">
      <rect width="440" height="80" fill="#1e1b4b" stroke="#7c3aed" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#c084fc" font-size="14">AED PROPHYLAXIS NOTE:</text>
      <text x="15" y="46" class="card-sub" fill="#e0e7ff">Primary AED prophylaxis is NOT routinely recommended for all patients.</text>
      <text x="15" y="64" class="card-sub" fill="#a5b4fc">High SeLECT scores (≥5) guide patient counseling &amp; prolonged cEEG surveillance.</text>
    </g>
  </g>

  <!-- Right Column: Visual Risk Bar Graph -->
  <g transform="translate(540, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="620" height="670" rx="12"/>
    <text x="25" y="35" class="card-title" fill="#38bdf8">1-YEAR &amp; 5-YEAR LATE EPILEPSY RISK PROBABILITY:</text>

    <!-- Legend -->
    <g transform="translate(380, 20)">
      <rect x="0" y="0" width="14" height="14" fill="#38bdf8" rx="3"/>
      <text x="22" y="12" class="card-sub" fill="#ffffff">1-Year Risk</text>
      <rect x="110" y="0" width="14" height="14" fill="#c084fc" rx="3"/>
      <text x="132" y="12" class="card-sub" fill="#ffffff">5-Year Risk</text>
    </g>

    <!-- Risk Bars for Scores 0 to 9 -->
    <!-- Score 0 -->
    <g transform="translate(30, 70)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 0:</text>
      <rect x="80" y="5" width="12" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="22" height="18" fill="#c084fc" rx="3"/>
      <text x="115" y="20" class="card-sub" fill="#4ade80">1yr: 0.7% | 5yr: 1.3% (Low)</text>
    </g>

    <!-- Score 1 -->
    <g transform="translate(30, 125)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 1:</text>
      <rect x="80" y="5" width="25" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="45" height="18" fill="#c084fc" rx="3"/>
      <text x="135" y="20" class="card-sub" fill="#4ade80">1yr: 1.8% | 5yr: 3.4%</text>
    </g>

    <!-- Score 2 -->
    <g transform="translate(30, 180)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 2:</text>
      <rect x="80" y="5" width="42" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="75" height="18" fill="#c084fc" rx="3"/>
      <text x="165" y="20" class="card-sub" fill="#4ade80">1yr: 3.2% | 5yr: 6.0%</text>
    </g>

    <!-- Score 3 -->
    <g transform="translate(30, 235)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 3:</text>
      <rect x="80" y="5" width="65" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="110" height="18" fill="#c084fc" rx="3"/>
      <text x="200" y="20" class="card-sub" fill="#fbbf24">1yr: 4.5% | 5yr: 8.3% (Moderate)</text>
    </g>

    <!-- Score 4 -->
    <g transform="translate(30, 290)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 4:</text>
      <rect x="80" y="5" width="110" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="190" height="18" fill="#c084fc" rx="3"/>
      <text x="280" y="20" class="card-sub" fill="#fbbf24">1yr: 9.0% | 5yr: 16%</text>
    </g>

    <!-- Score 5 -->
    <g transform="translate(30, 345)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 5:</text>
      <rect x="80" y="5" width="170" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="280" height="18" fill="#c084fc" rx="3"/>
      <text x="370" y="20" class="card-sub" fill="#f97316">1yr: 15% | 5yr: 26% (High)</text>
    </g>

    <!-- Score 6 -->
    <g transform="translate(30, 400)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 6:</text>
      <rect x="80" y="5" width="240" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="370" height="18" fill="#c084fc" rx="3"/>
      <text x="460" y="20" class="card-sub" fill="#f97316">1yr: 23% | 5yr: 38%</text>
    </g>

    <!-- Score 7 -->
    <g transform="translate(30, 455)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 7:</text>
      <rect x="80" y="5" width="340" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="460" height="18" fill="#c084fc" rx="3"/>
      <text x="430" y="20" class="card-sub" fill="#ef4444">1yr: 38% | 5yr: 58% (V.High)</text>
    </g>

    <!-- Score 8 - 9 -->
    <g transform="translate(30, 510)">
      <text x="0" y="20" class="card-body" font-weight="700">Score 8-9:</text>
      <rect x="80" y="5" width="440" height="18" fill="#38bdf8" rx="3"/>
      <rect x="80" y="26" width="510" height="18" fill="#c084fc" rx="3"/>
      <text x="430" y="20" class="card-sub" fill="#ef4444">1yr: 63% | 5yr: 83%</text>
    </g>

    <!-- Horizontal Scale Legend -->
    <g transform="translate(30, 580)">
      <line x1="80" y1="20" x2="590" y2="20" stroke="#475569" stroke-width="2"/>
      <text x="80" y="42" class="card-sub" text-anchor="middle">0%</text>
      <text x="207" y="42" class="card-sub" text-anchor="middle">25%</text>
      <text x="335" y="42" class="card-sub" text-anchor="middle">50%</text>
      <text x="462" y="42" class="card-sub" text-anchor="middle">75%</text>
      <text x="590" y="42" class="card-sub" text-anchor="middle">100%</text>
    </g>
  </g>
</svg>