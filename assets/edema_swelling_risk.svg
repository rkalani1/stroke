<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" role="img" aria-labelledby="edema-title edema-desc">
  <title id="edema-title">EDEMA Score Malignant MCA Swelling Risk Chart</title>
  <desc id="edema-desc">Visual risk stratification chart for EDEMA score predicting malignant MCA stroke edema and early decompressive hemicraniectomy requirement.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; }
      .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #f97316; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #e2e8f0; line-height: 1.5; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .card-bg { fill: #ffffff; stroke: #cbd5e1; }
        .title-text { fill: #0f172a; }
        .subtitle-text { fill: #ea580c; }
        .card-body { fill: #334155; }
        .card-sub { fill: #64748b; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="850" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="90" rx="12" stroke="#ea580c" stroke-width="2"/>
    <text x="560" y="40" class="title-text" text-anchor="middle">EDEMA SCORE — MALIGNANT MCA SWELLING RISK</text>
    <text x="560" y="68" class="subtitle-text" text-anchor="middle">Risk Calculator &amp; Triage Protocol for Severe Cerebral Edema &amp; Decompressive Hemicraniectomy</text>
  </g>

  <!-- Left Column: Criteria (0 - 7 points) -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="520" height="670" rx="12"/>
    <text x="25" y="35" class="card-title" fill="#fdba74">EDEMA SCORE CRITERIA (SCORE RANGE 0 – 7):</text>

    <!-- Criterion 1: NIHSS > 15 -->
    <g transform="translate(20, 55)">
      <rect width="480" height="75" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#38bdf8" font-size="15">Baseline NIHSS Score &gt; 15</text>
      <text x="15" y="48" class="card-body">• Severe neurological deficit at presentation</text>
      <rect x="380" y="20" width="85" height="35" fill="#0284c7" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+1 PT</text>
    </g>

    <!-- Criterion 2: Early CT sign > 1/3 MCA -->
    <g transform="translate(20, 140)">
      <rect width="480" height="75" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#fbbf24" font-size="15">Early CT Hypodensity &gt; 1/3 MCA Territory</text>
      <text x="15" y="48" class="card-body">• Parenchymal attenuation loss on initial NCCT</text>
      <rect x="380" y="20" width="85" height="35" fill="#d97706" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+1 PT</text>
    </g>

    <!-- Criterion 3: Hyperdense MCA Sign -->
    <g transform="translate(20, 225)">
      <rect width="480" height="75" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#a7f3d0" font-size="15">Hyperdense MCA Sign on NCCT</text>
      <text x="15" y="48" class="card-body">• Acute intravascular thrombus in M1/M2 segment</text>
      <rect x="380" y="20" width="85" height="35" fill="#059669" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+1 PT</text>
    </g>

    <!-- Criterion 4: Midline Shift > 3mm -->
    <g transform="translate(20, 310)">
      <rect width="480" height="75" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#ef4444" font-size="15">Septum Pellucidum Midline Shift &gt; 3 mm</text>
      <text x="15" y="48" class="card-body">• Early mass effect / subfalcine displacement</text>
      <rect x="380" y="20" width="85" height="35" fill="#dc2626" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+2 PTS</text>
    </g>

    <!-- Criterion 5: Glucose > 150 mg/dL -->
    <g transform="translate(20, 395)">
      <rect width="480" height="75" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#c084fc" font-size="15">Admission Blood Glucose &gt; 150 mg/dL (8.3 mmol/L)</text>
      <text x="15" y="48" class="card-body">• Admission hyperglycemia (blood-brain barrier disruption)</text>
      <rect x="380" y="20" width="85" height="35" fill="#7c3aed" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+1 PT</text>
    </g>

    <!-- Criterion 6: Prior Hypertension -->
    <g transform="translate(20, 480)">
      <rect width="480" height="75" fill="#0f172a" stroke="#334155" rx="8"/>
      <text x="15" y="24" class="card-title" fill="#94a3b8" font-size="15">Pre-existing History of Hypertension</text>
      <text x="15" y="48" class="card-body">• Chronic cerebrovascular hypertension history</text>
      <rect x="380" y="20" width="85" height="35" fill="#475569" rx="6"/>
      <text x="422" y="43" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+1 PT</text>
    </g>

    <!-- Surgical Intervention Note -->
    <g transform="translate(20, 570)">
      <rect width="480" height="80" fill="#451a03" stroke="#f97316" rx="8"/>
      <text x="15" y="25" class="card-title" fill="#fed7aa" font-size="14">DECOMPRESSIVE HEMICRANIECTOMY TIMING:</text>
      <text x="15" y="48" class="card-sub" fill="#ffffff">Surgical decompression performed within &lt; 48 hours reduces mortality from 70% to 22% in malignant MCA stroke (DECIMAL, DESTINY, HAMLET trials).</text>
    </g>
  </g>

  <!-- Right Column: Risk Stratification Meters & Actions -->
  <g transform="translate(580, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="580" height="670" rx="12"/>
    <text x="25" y="35" class="card-title" fill="#38bdf8">RISK TIER &amp; CLINICAL MANAGEMENT PROTOCOL:</text>

    <!-- Tier 1: Low Risk (0 - 2 pts) -->
    <g transform="translate(20, 55)">
      <rect width="540" height="175" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="10"/>
      <rect x="0" y="0" width="540" height="40" fill="#064e3b" rx="9"/>
      <text x="20" y="26" class="card-title" fill="#a7f3d0">SCORE 0 – 2: LOW RISK (&lt; 10% Malignant Swelling)</text>

      <text x="20" y="65" class="card-body" font-weight="700">• Recommended Care Level: <tspan font-weight="400">Step-down / Stroke Unit Ward.</tspan></text>
      <text x="20" y="88" class="card-body" font-weight="700">• Monitoring: <tspan font-weight="400">Standard q4h neurological checks, head of bed elevated 30°.</tspan></text>
      <text x="20" y="111" class="card-body" font-weight="700">• Imaging: <tspan font-weight="400">Repeat NCCT only if new neurological deterioration occurs.</tspan></text>
      <text x="20" y="134" class="card-body" font-weight="700">• Hyperosmolar Therapy: <tspan font-weight="400">Not indicated.</tspan></text>
    </g>

    <!-- Tier 2: Moderate Risk (3 - 4 pts) -->
    <g transform="translate(20, 245)">
      <rect width="540" height="185" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/>
      <rect x="0" y="0" width="540" height="40" fill="#78350f" rx="9"/>
      <text x="20" y="26" class="card-title" fill="#fde68a">SCORE 3 – 4: MODERATE RISK (25% – 40% Risk)</text>

      <text x="20" y="65" class="card-body" font-weight="700">• Recommended Care Level: <tspan font-weight="400">Neuro-ICU Admission.</tspan></text>
      <text x="20" y="88" class="card-body" font-weight="700">• Monitoring: <tspan font-weight="400">Strict q1h neurological checks, continuous arterial line.</tspan></text>
      <text x="20" y="111" class="card-body" font-weight="700">• Scheduled Imaging: <tspan font-weight="400">Mandatory repeat NCCT brain at 24h &amp; 48h.</tspan></text>
      <text x="20" y="134" class="card-body" font-weight="700">• Hyperosmolar Therapy: <tspan font-weight="400">3% Hypertonic Saline / Mannitol ready at bedside.</tspan></text>
      <text x="20" y="157" class="card-body" font-weight="700">• Consult: <tspan font-weight="400" fill="#fbbf24">Inform Neurosurgery on standby.</tspan></text>
    </g>

    <!-- Tier 3: High Risk (5 - 7 pts) -->
    <g transform="translate(20, 445)">
      <rect width="540" height="205" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="10"/>
      <rect x="0" y="0" width="540" height="40" fill="#7f1d1d" rx="9"/>
      <text x="20" y="26" class="card-title" fill="#fecaca">SCORE 5 – 7: HIGH RISK (&gt; 70% Malignant Swelling)</text>

      <text x="20" y="65" class="card-body" font-weight="700" fill="#ef4444">• URGENT ACTION: STAT NEUROSURGERY CONSULT FOR HEMICRANIECTOMY</text>
      <text x="20" y="90" class="card-body" font-weight="700">• Operative Window: <tspan font-weight="400">Perform surgery before herniation (&lt; 48 hours).</tspan></text>
      <text x="20" y="113" class="card-body" font-weight="700">• ICU Measures: <tspan font-weight="400">Intubation, mild hyperventilation (PaCO² 30-35), 3% Saline boluses (250mL) or Mannitol 1g/kg.</tspan></text>
      <text x="20" y="136" class="card-body" font-weight="700">• Targets: <tspan font-weight="400">Serum Osmolality 310-320 mOsm/kg, Na⁺ 145-155 mEq/L.</tspan></text>
      <text x="20" y="159" class="card-body" font-weight="700" fill="#fca5a5">• Avoid: Hypotonic fluids (D5W / 0.45% NaCl prohibited).</text>
    </g>
  </g>
</svg>