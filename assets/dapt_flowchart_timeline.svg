<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" role="img" aria-labelledby="dapt-title dapt-desc">
  <title id="dapt-title">DAPT (Dual Antiplatelet Therapy) Initiation &amp; Timeline</title>
  <desc id="dapt-desc">High-contrast clinical timeline schematic showing loading dose and 21-to-90 day maintenance protocols for Aspirin and Clopidogrel based on CHANCE and POINT trials.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; }
      .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #38bdf8; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #e2e8f0; line-height: 1.5; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .axis-line { stroke: #475569; stroke-width: 3; stroke-linecap: round; }
      .marker-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 4 4; }
      
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .card-bg { fill: #ffffff; stroke: #cbd5e1; }
        .title-text { fill: #0f172a; }
        .subtitle-text { fill: #0284c7; }
        .card-body { fill: #334155; }
        .card-sub { fill: #64748b; }
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="dapt-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="800" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="90" rx="12" stroke="#0284c7" stroke-width="2"/>
    <text x="560" y="40" class="title-text" text-anchor="middle">DUAL ANTIPLATELET THERAPY (DAPT) TIMELINE</text>
    <text x="560" y="68" class="subtitle-text" text-anchor="middle">Acute Minor Ischemic Stroke (NIHSS ≤ 3) &amp; High-Risk TIA (ABCD² ≥ 4) • CHANCE &amp; POINT Protocols</text>
  </g>

  <!-- Eligibility Box -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="90" rx="10"/>
    <text x="25" y="32" class="card-title" fill="#38bdf8">INCLUSION CRITERIA (Initiate within 24 Hours of Symptom Onset):</text>
    <text x="25" y="58" class="card-body">• High-Risk TIA (ABCD² Score ≥ 4)  OR  Minor Non-Cardioembolic Ischemic Stroke (NIHSS ≤ 3)</text>
    <text x="25" y="76" class="card-sub" fill="#f43f5e">• Exclude: IV Thrombolysis / Thrombectomy candidates, active bleeding, anticoagulation indication, or severe thrombocytopenia.</text>
  </g>

  <!-- Horizontal Timeline Bar Graph -->
  <g transform="translate(40, 260)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="340" rx="12"/>

    <!-- Timeline Track Base -->
    <rect x="120" y="160" width="880" height="36" fill="#334155" rx="18"/>
    
    <!-- DAPT Window Highlight (Day 0 to Day 21) -->
    <rect x="120" y="160" width="340" height="36" fill="url(#dapt-grad)" rx="18"/>
    <text x="290" y="183" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">21-DAY DAPT OPTIMAL WINDOW (CHANCE)</text>

    <!-- SAPT Continuation Track (Day 21 to Day 90+) -->
    <rect x="460" y="160" width="540" height="36" fill="#0f766e" rx="0"/>
    <text x="730" y="183" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SAPT MONOTHERAPY CONTINUATION (DAYS 21 - 90+)</text>

    <!-- Day Markers & Vertical Lines -->
    <!-- Day 0 / Hour 0 -->
    <line x1="120" y1="90" x2="120" y2="240" stroke="#ef4444" stroke-width="3"/>
    <circle cx="120" cy="178" r="10" fill="#ef4444"/>
    <text x="120" y="70" class="card-title" fill="#ef4444" text-anchor="middle">DAY 0 (LOAD)</text>
    <text x="120" y="260" class="card-sub" text-anchor="middle">Within 24h of onset</text>

    <!-- Day 21 -->
    <line x1="460" y1="90" x2="460" y2="240" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="460" cy="178" r="10" fill="#38bdf8"/>
    <text x="460" y="70" class="card-title" fill="#38bdf8" text-anchor="middle">DAY 21</text>
    <text x="460" y="260" class="card-sub" text-anchor="middle">CHANCE Endpoint / DAPT Stop</text>

    <!-- Day 90 -->
    <line x1="1000" y1="90" x2="1000" y2="240" stroke="#10b981" stroke-width="3"/>
    <circle cx="1000" cy="178" r="10" fill="#10b981"/>
    <text x="1000" y="70" class="card-title" fill="#10b981" text-anchor="middle">DAY 90</text>
    <text x="1000" y="260" class="card-sub" text-anchor="middle">POINT Endpoint</text>

    <!-- Dosing Cards Above Timeline -->
    <!-- Loading Dose Box -->
    <g transform="translate(40, 20)">
      <rect width="220" height="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
      <text x="110" y="25" class="card-title" fill="#a5b4fc" text-anchor="middle">LOADING DOSE (DAY 1)</text>
      <text x="110" y="48" class="card-body" font-weight="700" fill="#ffffff" text-anchor="middle">Aspirin: 160 – 325 mg po</text>
      <text x="110" y="70" class="card-body" font-weight="700" fill="#38bdf8" text-anchor="middle">Clopidogrel: 300 – 600 mg po</text>
    </g>

    <!-- DAPT Daily Maintenance Box -->
    <g transform="translate(300, 20)">
      <rect width="280" height="90" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" rx="8"/>
      <text x="140" y="25" class="card-title" fill="#38bdf8" text-anchor="middle">DAPT MAINTENANCE (DAYS 2–21)</text>
      <text x="140" y="48" class="card-body" fill="#ffffff" text-anchor="middle">Aspirin: <tspan font-weight="700">81 mg daily</tspan></text>
      <text x="140" y="70" class="card-body" fill="#e0f2fe" text-anchor="middle">+ Clopidogrel: <tspan font-weight="700">75 mg daily</tspan></text>
    </g>

    <!-- SAPT Long Term Box -->
    <g transform="translate(640, 20)">
      <rect width="320" height="90" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="8"/>
      <text x="160" y="25" class="card-title" fill="#34d399" text-anchor="middle">SAPT MONOTHERAPY (DAY 22 ONWARD)</text>
      <text x="160" y="48" class="card-body" fill="#ffffff" text-anchor="middle">Discontinue Clopidogrel (or Aspirin)</text>
      <text x="160" y="70" class="card-body" font-weight="700" fill="#a7f3d0" text-anchor="middle">Continue SAPT (Aspirin 81mg OR Clopidogrel 75mg)</text>
    </g>
  </g>

  <!-- Trial Evidence Comparison Footer -->
  <g transform="translate(40, 620)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="150" rx="12"/>
    <text x="25" y="30" class="card-title" fill="#f59e0b">CLINICAL TRIAL EVIDENCE &amp; BENEFIT-RISK TRADEOFF:</text>
    
    <!-- CHANCE Summary Box -->
    <g transform="translate(25, 45)">
      <rect width="520" height="85" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="6"/>
      <text x="15" y="24" class="card-title" fill="#38bdf8" font-size="14">CHANCE Trial (China, N=5,170 • 21-Day DAPT)</text>
      <text x="15" y="46" class="card-body">• Recurrent Stroke at 90 days: <tspan font-weight="700" fill="#4ade80">8.2% DAPT vs 11.7% Aspirin</tspan> (HR 0.68, P&lt;0.001)</text>
      <text x="15" y="66" class="card-body">• Major Hemorrhage: <tspan font-weight="700">0.3% vs 0.3%</tspan> (No significant increase in bleeding).</text>
    </g>

    <!-- POINT Summary Box -->
    <g transform="translate(575, 45)">
      <rect width="520" height="85" fill="#0f172a" stroke="#f43f5e" stroke-width="1" rx="6"/>
      <text x="15" y="24" class="card-title" fill="#f43f5e" font-size="14">POINT Trial (International, N=4,881 • 90-Day DAPT)</text>
      <text x="15" y="46" class="card-body">• Major Ischemic Events: <tspan font-weight="700" fill="#4ade80">5.0% DAPT vs 6.5% Aspirin</tspan> (HR 0.75, P=0.02)</text>
      <text x="15" y="66" class="card-body">• Major Hemorrhage: <tspan font-weight="700" fill="#f43f5e">0.9% DAPT vs 0.4% Aspirin</tspan> (Risk predominantly after Day 21).</text>
    </g>
  </g>
</svg>