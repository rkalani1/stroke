<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">Ischemic Core vs Penumbra CT Perfusion Render</title>
  <desc id="core-desc">CT perfusion visual mismatch map rendering irreversible ischemic core (rCBF &lt; 30%) and salvageable ischemic penumbra (Tmax &gt; 6s) with EXTENDED window EVT eligibility criteria.</desc>
  <defs>
    <style>
      .bg { fill: #090d16; }
      .card-bg { fill: #131c2e; stroke: #1e2d4a; stroke-width: 1.5; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; }
      .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #38bdf8; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #e2e8f0; line-height: 1.5; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      
      @media (prefers-color-scheme: light) {
        .bg { fill: #0f172a; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        .title-text { fill: #f8fafc; }
        .subtitle-text { fill: #38bdf8; }
        .card-body { fill: #e2e8f0; }
        .card-sub { fill: #94a3b8; }
      }
    </style>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="skull-grad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="92%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="penumbra-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.10"/>
    </radialGradient>
    <radialGradient id="core-grad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.40"/>
    </radialGradient>
    <radialGradient id="normal-brain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="900" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect class="card-bg" width="1120" height="90" rx="12" stroke="#38bdf8" stroke-width="2"/>
    <text x="560" y="40" class="title-text" text-anchor="middle">CT PERFUSION: ISCHEMIC CORE VS. PENUMBRA</text>
    <text x="560" y="68" class="subtitle-text" text-anchor="middle">Perfusion Mismatch Analysis for Extended Window Endovascular Thrombectomy (DAWN / DEFUSE-3 Criteria)</text>
  </g>

  <!-- Left: Axial Brain CT Perfusion Render Display -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="600" height="660" rx="12"/>
    <text x="300" y="35" class="card-title" fill="#38bdf8" text-anchor="middle">AXIAL CT PERFUSION (CTP) COLOR MAP</text>

    <!-- Skull Contour (Elliptical Brain Vault) -->
    <g transform="translate(60, 60)">
      <!-- Outer Bone Skull -->
      <path d="M 240 20 C 370 20 440 100 440 260 C 440 420 370 500 240 500 C 110 500 40 420 40 260 C 40 100 110 20 240 20 Z" fill="none" stroke="#64748b" stroke-width="14" opacity="0.8"/>
      <path d="M 240 24 C 365 24 432 102 432 260 C 432 418 365 494 240 494 C 115 494 48 418 48 260 C 48 102 115 24 240 24 Z" fill="url(#normal-brain)" stroke="#334155" stroke-width="2"/>

      <!-- Midline Falx Cerebri -->
      <line x1="240" y1="35" x2="240" y2="480" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

      <!-- Lateral Ventricles (Normal right & left subcortical shapes) -->
      <path d="M 225 180 C 220 210 220 250 228 290 C 235 250 235 210 225 180 Z" fill="#0f172a" stroke="#334155"/>
      <path d="M 255 180 C 260 210 260 250 252 290 C 245 250 245 210 255 180 Z" fill="#0f172a" stroke="#334155"/>

      <!-- Normal Right Hemisphere Normal Perfusion Texture (Cyan-Blue Tint) -->
      <path d="M 80 180 C 70 240 90 320 140 400 C 180 430 220 450 230 450 L 230 70 C 160 70 100 120 80 180 Z" fill="#0284c7" opacity="0.12"/>

      <!-- LEFT MCA ISCHEMIC PENUMBRA AREA (Tmax > 6s - Large Yellow Area) -->
      <g filter="url(#glow-yellow)">
        <path d="M 245 100 C 330 90 410 140 420 240 C 430 330 380 410 320 440 C 280 460 245 440 245 350 C 245 250 270 180 245 100 Z" fill="url(#penumbra-grad)"/>
      </g>

      <!-- LEFT MCA ISCHEMIC CORE AREA (rCBF < 30% - Dense Central Red Area) -->
      <g filter="url(#glow-red)">
        <path d="M 270 190 C 330 180 370 220 375 280 C 380 330 340 370 300 370 C 275 370 265 310 265 260 C 265 220 260 200 270 190 Z" fill="url(#core-grad)"/>
      </g>

      <!-- Callout Line & Pointer: Ischemic Core -->
      <polyline points="330, 260 410, 230 480, 230" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      <circle cx="330" cy="260" r="5" fill="#ef4444"/>
      <rect x="480" y="210" width="100" height="36" fill="#7f1d1d" rx="6" stroke="#ef4444"/>
      <text x="530" y="233" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CORE</text>

      <!-- Callout Line & Pointer: Ischemic Penumbra -->
      <polyline points="370, 150 440, 120 480, 120" fill="none" stroke="#facc15" stroke-width="2.5"/>
      <circle cx="370" cy="150" r="5" fill="#facc15"/>
      <rect x="480" y="100" width="100" height="36" fill="#713f12" rx="6" stroke="#facc15"/>
      <text x="530" y="123" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">PENUMBRA</text>

      <!-- Callout Line & Pointer: Normal Contralateral -->
      <polyline points="120, 260 50, 260 -20, 260" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="120" cy="260" r="5" fill="#38bdf8"/>
      <rect x="-110" y="242" width="90" height="36" fill="#0c4a6e" rx="6" stroke="#38bdf8"/>
      <text x="-65" y="265" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">NORMAL</text>
    </g>

    <!-- Map Color Bar Legend at Bottom -->
    <g transform="translate(60, 580)">
      <text x="0" y="18" class="card-sub" fill="#e2e8f0">Perfusion Scale:</text>
      <rect x="100" y="5" width="440" height="18" fill="url(#dapt-grad)" rx="4"/>
      <!-- Colors: Red (Core) -> Yellow (Penumbra) -> Blue (Normal) -->
      <rect x="100" y="5" width="80" fill="#ef4444"/>
      <rect x="180" y="5" width="140" fill="#facc15"/>
      <rect x="320" y="5" width="220" fill="#0284c7"/>
      <text x="140" y="38" class="card-sub" fill="#ef4444" text-anchor="middle">rCBF &lt; 30%</text>
      <text x="250" y="38" class="card-sub" fill="#facc15" text-anchor="middle">Tmax &gt; 6.0s</text>
      <text x="430" y="38" class="card-sub" fill="#38bdf8" text-anchor="middle">Normal Tissue</text>
    </g>
  </g>

  <!-- Right: Quantitative Parameters & Eligibility Panel -->
  <g transform="translate(660, 140)" filter="url(#shadow)">
    <rect class="card-bg" width="500" height="660" rx="12"/>
    <text x="250" y="35" class="card-title" fill="#38bdf8" text-anchor="middle">AUTOMATED CTP QUANTITATIVE PROFILE</text>

    <!-- Ischemic Core Box -->
    <g transform="translate(25, 55)">
      <rect width="450" height="100" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="8"/>
      <text x="20" y="30" class="card-title" fill="#ef4444">ISCHEMIC CORE VOLUME (rCBF &lt; 30%)</text>
      <text x="20" y="65" font-family="sans-serif" font-size="32" font-weight="900" fill="#ef4444">18 mL</text>
      <text x="160" y="58" class="card-body" fill="#fca5a5">• Irreversibly damaged tissue</text>
      <text x="160" y="78" class="card-sub" fill="#94a3b8">• Threshold: &lt; 70 mL for EVT candidate</text>
    </g>

    <!-- Hypoperfused / Penumbra Box -->
    <g transform="translate(25, 175)">
      <rect width="450" height="100" fill="#0f172a" stroke="#facc15" stroke-width="2" rx="8"/>
      <text x="20" y="30" class="card-title" fill="#facc15">HYPOPERFUSED VOLUME (Tmax &gt; 6.0s)</text>
      <text x="20" y="65" font-family="sans-serif" font-size="32" font-weight="900" fill="#facc15">85 mL</text>
      <text x="160" y="58" class="card-body" fill="#fef08a">• Total tissue at ischemic risk</text>
      <text x="160" y="78" class="card-sub" fill="#94a3b8">• Includes both core &amp; penumbra</text>
    </g>

    <!-- Mismatch Volume Box -->
    <g transform="translate(25, 295)">
      <rect width="450" height="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="8"/>
      <text x="20" y="30" class="card-title" fill="#38bdf8">TARGET MISMATCH VOLUME</text>
      <text x="20" y="65" font-family="sans-serif" font-size="32" font-weight="900" fill="#38bdf8">67 mL</text>
      <text x="160" y="55" class="card-body" fill="#7dd3fc">• Calculation: 85 mL – 18 mL</text>
      <text x="160" y="75" class="card-sub" fill="#94a3b8">• Salvageable brain tissue profile</text>
    </g>

    <!-- Mismatch Ratio Box -->
    <g transform="translate(25, 415)">
      <rect width="450" height="90" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="8"/>
      <text x="20" y="30" class="card-title" fill="#c084fc">MISMATCH RATIO (Tmax&gt;6s / Core)</text>
      <text x="20" y="65" font-family="sans-serif" font-size="32" font-weight="900" fill="#c084fc">4.7</text>
      <text x="130" y="55" class="card-body" fill="#e9d5ff">• Target Mismatch Ratio ≥ 1.8</text>
      <text x="130" y="75" class="card-sub" fill="#94a3b8">• Fulfills DEFUSE-3 &amp; DAWN criteria</text>
    </g>

    <!-- EVT Decision Banner -->
    <g transform="translate(25, 525)">
      <rect width="450" height="110" fill="#064e3b" stroke="#10b981" stroke-width="2.5" rx="10"/>
      <text x="225" y="35" font-family="sans-serif" font-size="18" font-weight="800" fill="#34d399" text-anchor="middle">EVT ELIGIBILITY STATUS: HIGH BENEFIT</text>
      <text x="225" y="65" class="card-body" font-weight="700" fill="#ffffff" text-anchor="middle">Fulfills Extended Window EVT Criteria (6 – 24 Hours)</text>
      <text x="225" y="90" class="card-sub" fill="#a7f3d0" text-anchor="middle">Small Core (18 mL &lt; 70 mL) + High Mismatch (4.7 ≥ 1.8) → Proceed to Cath Lab</text>
    </g>
  </g>
</svg>